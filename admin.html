<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinthiya Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14171A;--soft:#5A6169;--line:#E7E9EC;--bg:#F6F8F7;--brand:#0E9E6D;--dark:#0A7A54;--danger:#D64545;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{background:var(--ink);color:#fff;padding:14px 16px;font-weight:700}
#login{max-width:340px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;margin-top:4px}
label{font-size:13px;color:var(--soft);font-weight:600;display:block;margin-top:10px}
button{font:inherit;cursor:pointer}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn.red{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.tabs button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;white-space:nowrap;font-weight:600}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1;min-width:120px}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:700;background:#F3E4C4;color:#9A6A10}
.badge.confirmed{background:#D9EBDF;color:var(--dark)} .badge.cancelled{background:#F3D6D1;color:var(--danger)}
.muted{color:var(--soft);font-size:13.5px} .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;display:none;z-index:9}
img.pv{width:100%;max-width:200px;border-radius:8px;display:block;margin-top:8px}
</style>
</head>
<body>
<div id="login">
  <h2 style="margin-top:0">অ্যাডমিন লগইন</h2>
  <input type="password" id="pw" placeholder="পাসওয়ার্ড" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
  <button class="btn" style="width:100%;margin-top:12px" id="loginBtn">প্রবেশ করুন</button>
  <div id="loginMsg" style="color:var(--danger);font-size:13.5px;margin-top:10px;min-height:18px"></div>
</div>

<div id="app" style="display:none">
  <header>Sinthiya Organic — অ্যাডমিন</header>
  <div class="wrap">
    <div class="tabs" id="tabs">
      <button data-t="orders" class="on">অর্ডার</button><button data-t="products">প্রোডাক্ট</button>
      <button data-t="reviews">রিভিউ</button><button data-t="site">সাইট ছবি</button>
    </div>
    <div id="orders"></div><div id="products" style="display:none"></div>
    <div id="reviews" style="display:none"></div><div id="site" style="display:none"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const FN = "https://jlussgczauobxfdigcpf.supabase.co/functions/v1";
let PW = "", ORDERS = [], DATA = {products:[], reviews:[]}, ofilter = "pending";
const $ = id => document.getElementById(id);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast = t => { $("toast").textContent = t; $("toast").style.display = "block"; setTimeout(()=>$("toast").style.display="none", 2800); };

async function api(name, body, method = "POST"){
  const res = await fetch(`${FN}/${name}`, { method, headers: {"Content-Type":"application/json","x-admin-password":PW}, body: method==="GET"?undefined:JSON.stringify(body) });
  const d = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(d.error || "ব্যর্থ হয়েছে");
  return d;
}
const toB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.onerror = no; r.readAsDataURL(f); });
async function uploadFile(file, folder){ const d = await api("admin-api", {action:"upload", folder, filename:file.name, image_base64: await toB64(file)}); return d.url; }

async function login(){
  const pw = $("pw").value.trim(); $("loginMsg").textContent = "যাচাই হচ্ছে...";
  try{
    PW = pw; const d = await api("list-orders", null, "GET"); ORDERS = d.orders || [];
    sessionStorage.setItem("sin_pw", pw); $("login").style.display = "none"; $("app").style.display = "block";
    await loadData(); renderOrders();
  }catch(e){ PW = ""; $("loginMsg").textContent = e.message === "unauthorized" ? "ভুল পাসওয়ার্ড।" : "সংযোগ ব্যর্থ: " + e.message; }
}
$("loginBtn").onclick = login; $("pw").onkeydown = e => { if(e.key === "Enter") login(); };
const saved = sessionStorage.getItem("sin_pw"); if(saved){ $("pw").value = saved; login(); }

async function loadData(){ DATA = await api("admin-api", {action:"list_all"}); renderProducts(); renderReviews(); renderSite(); }

$("tabs").onclick = e => {
  if(e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === e.target));
  ["orders","products","reviews","site"].forEach(t => $(t).style.display = t === e.target.dataset.t ? "block" : "none");
};

/* ---------- ORDERS ---------- */
const stLabel = {pending:"পেন্ডিং",confirmed:"কনফার্মড",cancelled:"বাতিল"};
function renderOrders(){
  const list = ORDERS.filter(o => ofilter === "all" || o.status === ofilter);
  $("orders").innerHTML = `<div class="row" style="margin-bottom:12px">${["pending","confirmed","cancelled","all"].map(f=>`<button class="btn ${f===ofilter?"":"ghost"}" onclick="ofilter='${f}';renderOrders()">${stLabel[f]||"সব"}</button>`).join("")}</div>` +
  (list.length ? list.map(o => `<div class="card">
    <div class="row" style="justify-content:space-between"><b>${esc(o.order_number)}</b><span class="badge ${o.status}">${stLabel[o.status]||o.status}</span></div>
    <div class="muted">${esc(o.customer_name)} · ${esc(o.phone)}</div><div class="muted">${esc(o.address)}</div>
    <ul>${(o.order_items||[]).map(i=>`<li>${esc(i.product_name)} × ${i.quantity} — ৳${i.unit_price*i.quantity}</li>`).join("")}</ul>
    <div class="muted">ডেলিভারি ৳${o.delivery_charge}</div><b>সর্বমোট ৳${o.total}</b>
    ${o.status==="pending"?`<div class="row" style="margin-top:10px"><button class="btn" onclick="act('${o.id}','confirm',this)">কনফার্ম করে SteadFast-এ পাঠান</button><button class="btn red" onclick="act('${o.id}','cancel',this)">বাতিল</button></div>`:""}
  </div>`).join("") : `<p class="muted" style="text-align:center;padding:30px">এই তালিকায় কোনো অর্ডার নেই।</p>`);
}
async function act(id, action, btn){
  btn.disabled = true; btn.textContent = "অপেক্ষা করুন...";
  try{ const d = await api("confirm-order", {order_id:id, action}); ORDERS.find(o=>o.id===id).status = d.status; toast(action==="confirm"?"SteadFast-এ বুকিং হয়েছে ✓":"বাতিল হয়েছে"); }
  catch(e){ toast("এরর: " + e.message); }
  renderOrders();
}

/* ---------- PRODUCTS ---------- */
function productForm(p){
  const id = p.id || "new";
  return `<div class="card" id="pf-${id}">
    <b>${p.id ? esc(p.name) : "নতুন প্রোডাক্ট"}</b>
    <label>নাম</label><input id="n-${id}" value="${esc(p.name)}">
    <div class="row"><div><label>বিক্রয় মূল্য (৳)</label><input id="pr-${id}" type="number" value="${p.price ?? ""}"></div><div><label>কেনা মূল্য (৳)</label><input id="co-${id}" type="number" value="${p.cost ?? ""}"></div><div><label>সিরিয়াল</label><input id="so-${id}" type="number" value="${p.sort_order ?? 0}"></div></div>
    <label>বিবরণ (Description)</label><textarea id="de-${id}" rows="2">${esc(p.description)}</textarea>
    <div class="row"><div><label>তেল (মিলি)</label><input id="oi-${id}" type="number" value="${p.oil_ml ?? ""}"></div><div><label>হেয়ার প্যাক (গ্রাম)</label><input id="hp-${id}" type="number" value="${p.hairpack_g ?? ""}"></div><div><label>শ্যাম্পু (মিলি)</label><input id="sh-${id}" type="number" value="${p.shampoo_ml ?? ""}"></div></div>
    <label>ছবি</label>${p.image_url?`<img class="pv" src="${esc(p.image_url)}">`:""}<input type="file" accept="image/*" id="im-${id}">
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ac-${id}" ${p.active!==false?"checked":""} style="width:auto;margin:0"> সাইটে দেখাবে (Active)</label>
    <button class="btn" style="margin-top:12px;width:100%" onclick="saveProduct('${id}','${esc(p.image_url||"")}')">সেভ করুন</button>
  </div>`;
}
function renderProducts(){ $("products").innerHTML = `<button class="btn" style="width:100%;margin-bottom:12px" onclick="addProduct()">+ নতুন প্রোডাক্ট</button><div id="newSlot"></div>` + DATA.products.map(productForm).join(""); }
function addProduct(){ $("newSlot").innerHTML = productForm({}); }
async function saveProduct(id, oldImg){
  const v = k => $(`${k}-${id}`).value;
  try{
    let image_url = oldImg || null; const f = $(`im-${id}`).files[0]; if(f) image_url = await uploadFile(f, "products");
    await api("admin-api", {action:"upsert_product", product:{ id: id==="new"?undefined:id, name:v("n"), price:v("pr"), cost:v("co"), sort_order:v("so"), description:v("de"), oil_ml:v("oi"), hairpack_g:v("hp"), shampoo_ml:v("sh"), image_url, active:$(`ac-${id}`).checked }});
    toast("সেভ হয়েছে ✓"); await loadData();
  }catch(e){ toast("এরর: " + e.message); }
}

/* ---------- REVIEWS ---------- */
function renderReviews(){
  $("reviews").innerHTML = `<div class="card"><b>নতুন রিভিউ যোগ করুন</b>
    <label>কাস্টমারের নাম</label><input id="rn"><label>রিভিউ লেখা</label><textarea id="rt" rows="2"></textarea>
    <div class="row"><div><label>রেটিং (১-৫)</label><input id="rr" type="number" min="1" max="5" value="5"></div><div><label>ছবি/স্ক্রিনশট</label><input type="file" accept="image/*" id="ri"></div></div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="addReview()">যোগ করুন</button></div>` +
  DATA.reviews.map(r => `<div class="card"><b>${esc(r.customer_name)}</b> <span class="muted">${"★".repeat(r.rating||5)}</span>
    <div class="muted">${esc(r.review_text)}</div>${r.image_url?`<img class="pv" src="${esc(r.image_url)}">`:""}
    <button class="btn red" style="margin-top:10px" onclick="delReview('${r.id}')">মুছুন</button></div>`).join("");
}
async function addReview(){
  try{
    if(!$("rn").value.trim()) return toast("নাম দিন");
    const f = $("ri").files[0]; const image_url = f ? await uploadFile(f, "reviews") : null;
    await api("admin-api", {action:"upsert_review", review:{customer_name:$("rn").value.trim(), review_text:$("rt").value.trim(), rating:$("rr").value, image_url}});
    toast("যোগ হয়েছে ✓"); await loadData();
  }catch(e){ toast("এরর: " + e.message); }
}
async function delReview(id){ if(!confirm("মুছে ফেলবেন?")) return; try{ await api("admin-api",{action:"delete_review", id}); await loadData(); }catch(e){ toast("এরর: "+e.message); } }

/* ---------- SITE IMAGE ---------- */
function renderSite(){
  $("site").innerHTML = `<div class="card"><b>হোমপেজের মূল ছবি (Hero)</b><p class="muted">সাইটের একদম উপরের বড় ছবি এখান থেকে বদলান।</p>
    <input type="file" accept="image/*" id="hi"><button class="btn" style="width:100%;margin-top:12px" onclick="saveHero()">আপলোড করুন</button></div>`;
}
async function saveHero(){
  const f = $("hi").files[0]; if(!f) return toast("ছবি বেছে নিন");
  try{ const url = await uploadFile(f, "site"); await api("admin-api", {action:"set_setting", key:"hero_image_url", value:url}); toast("হোমপেজের ছবি বদলেছে ✓"); }
  catch(e){ toast("এরর: " + e.message); }
}
</script>
</body>
</html>
