<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>পাসওয়ার্ড রিসেট — Sinthiya Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#14171A;--soft:#5A6169;--line:#E7E9EC;--bg:#F6F8F7;--brand:#0E9E6D;--danger:#D64545;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
  .box{max-width:340px;margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-top:14px}
  button{width:100%;margin-top:16px;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:11px;font-weight:700;font:inherit;cursor:pointer}
  button:disabled{opacity:.6}
  p.msg{font-size:13.5px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<div class="box">
  <h2 style="margin-top:0">নতুন পাসওয়ার্ড সেট করুন</h2>
  <div id="formArea">
    <input type="password" id="pw1" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬ ক্যারেক্টার)">
    <input type="password" id="pw2" placeholder="আবার লিখুন">
    <button id="saveBtn">পাসওয়ার্ড সেভ করুন</button>
  </div>
  <p class="msg" id="msg" style="color:var(--danger)"></p>
</div>
<script>
const SUPABASE_URL = "https://jlussgczauobxfdigcpf.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsdXNzZ2N6YXVvYnhmZGlnY3BmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODgwOTgsImV4cCI6MjEwNTY2NDA5OH0.9VedHmJeRP44Q0WcpAmXRzNgod473Oslk3oVrZpllzQ";

const params = new URLSearchParams(location.hash.replace("#","?"));
const accessToken = params.get("access_token");
const msg = document.getElementById("msg");

if(!accessToken){
  document.getElementById("formArea").style.display = "none";
  msg.textContent = "এই লিংকটা মেয়াদোত্তীর্ণ বা অসম্পূর্ণ। আবার 'পাসওয়ার্ড ভুলে গেছেন' থেকে নতুন লিংক চান।";
}

document.getElementById("saveBtn")?.addEventListener("click", async () => {
  const pw1 = document.getElementById("pw1").value, pw2 = document.getElementById("pw2").value;
  const btn = document.getElementById("saveBtn");
  if(pw1.length < 6){ msg.style.color = "var(--danger)"; msg.textContent = "কমপক্ষে ৬ ক্যারেক্টার দিন।"; return; }
  if(pw1 !== pw2){ msg.style.color = "var(--danger)"; msg.textContent = "দুটো পাসওয়ার্ড মিলছে না।"; return; }
  btn.disabled = true; btn.textContent = "সেভ হচ্ছে...";
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method: "PUT",
      headers: { "Content-Type":"application/json", "apikey": ANON_KEY, "Authorization": `Bearer ${accessToken}` },
      body: JSON.stringify({ password: pw1 }),
    });
    const d = await res.json();
    if(!res.ok) throw new Error(d.msg || d.error_description || "ব্যর্থ হয়েছে");
    document.getElementById("formArea").style.display = "none";
    msg.style.color = "var(--brand)";
    msg.textContent = "পাসওয়ার্ড বদলানো হয়েছে ✓ এখন admin.html থেকে নতুন পাসওয়ার্ড দিয়ে লগইন করুন।";
  }catch(e){
    msg.style.color = "var(--danger)"; msg.textContent = e.message;
    btn.disabled = false; btn.textContent = "পাসওয়ার্ড সেভ করুন";
  }
});
</script>
</body>
</html>
